<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rifornimento JP-8</title>

  <!-- Configurazione PWA per iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JP-8 Fuel">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --primary: #3b82f6;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --text: #f8fafc;
      --accent: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header img {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      margin-bottom: 8px;
    }
    h2 {
      margin: 0;
      color: #60a5fa;
      font-size: 1.5em;
      letter-spacing: 0.5px;
    }
    .unit-selector {
      display: flex;
      background: #0f172a;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .unit-selector label {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 0.9em;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      color: #94a3b8;
    }
    .unit-selector input[type="radio"] {
      display: none;
    }
    .unit-selector input[type="radio"]:checked + span {
      background-color: var(--primary);
      color: white;
      display: block;
      padding: 6px;
      border-radius: 6px;
    }
    .form-group { margin-bottom: 14px; }
    label.field-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85em;
      color: #94a3b8;
    }
    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 1em;
      background-color: #0f172a;
      color: #ffffff;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95em;
      font-weight: bold;
      cursor: pointer;
    }
    .geo-btn {
      background-color: var(--accent);
      color: white;
      margin-bottom: 16px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      background: rgba(15, 23, 42, 0.7);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
    }
    .result p { margin: 6px 0; font-size: 0.9em; color: #cbd5e1; }
    .highlight {
      font-size: 1.6em;
      font-weight: 800;
      color: #38bdf8;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <img src="icon-192.png" alt="JP8 Logo" onerror="this.style.display='none'">
    <h2>Calcolatore JP-8</h2>
  </div>

  <!-- Selezione Unità di Misura -->
  <div class="unit-selector">
    <label>
      <input type="radio" name="unit" value="kg" checked onchange="aggiornaEtichette()">
      <span>Chilogrammi (kg)</span>
    </label>
    <label>
      <input type="radio" name="unit" value="lbs" onchange="aggiornaEtichette()">
      <span>Libbre (lbs)</span>
    </label>
  </div>

  <button class="geo-btn" onclick="ottieniTemperaturaPosizione()">📍 Temperatura da Posizione</button>

  <div class="form-group">
    <label class="field-label" for="temp">Temperatura Ambiente (°C):</label>
    <input type="number" id="temp" step="0.1" value="15.0" oninput="calcolaLitri()">
  </div>

  <div class="form-group">
    <label class="field-label" id="lblAttuale" for="attuale">Quantità Attuale a Bordo (kg):</label>
    <input type="number" id="attuale" placeholder="Es. 800" oninput="calcolaLitri()">
  </div>

  <div class="form-group">
    <label class="field-label" id="lblTarget" for="target">Quantità Finale Richiesta (kg):</label>
    <input type="number" id="target" placeholder="Es. 2000" oninput="calcolaLitri()">
  </div>

  <div class="result" id="risultato" style="display: none;">
    <p>Densità stimata JP-8: <strong id="densitaVal" style="color:#fff;">--</strong> kg/L</p>
    <p>Massa da immettere: <strong id="massaVal" style="color:#fff;">--</strong></p>
    <p>Volume da rifornire nei serbatoi:</p>
    <span class="highlight" id="litriVal">-- Litri</span>
  </div>
</div>

<script>
  function aggiornaEtichette() {
    const unita = document.querySelector('input[name="unit"]:checked').value;
    document.getElementById('lblAttuale').innerText = `Quantità Attuale a Bordo (${unita}):`;
    document.getElementById('lblTarget').innerText = `Quantità Finale Richiesta (${unita}):`;
    calcolaLitri();
  }

  function calcolaDensita(tempC) {
    return 0.800 - (0.0007 * (tempC - 15));
  }

  function calcolaLitri() {
    const temp = parseFloat(document.getElementById('temp').value);
    let attuale = parseFloat(document.getElementById('attuale').value);
    let target = parseFloat(document.getElementById('target').value);
    const unita = document.querySelector('input[name="unit"]:checked').value;

    if (isNaN(temp) || isNaN(attuale) || isNaN(target) || target <= attuale) {
      document.getElementById('risultato').style.display = 'none';
      return;
    }

    const massaMancanteInput = target - attuale;
    let massaMancanteKg = massaMancanteInput;

    // Se l'input è in libbre, convertiamo la massa in kg per il calcolo con la densità
    if (unita === 'lbs') {
      massaMancanteKg = massaMancanteInput * 0.45359237;
    }

    const densita = calcolaDensita(temp);
    const litri = massaMancanteKg / densita;

    document.getElementById('densitaVal').innerText = densita.toFixed(4);
    document.getElementById('massaVal').innerText = `${Math.round(massaMancanteInput)} ${unita} (${Math.round(massaMancanteKg)} kg)`;
    document.getElementById('litriVal').innerText = Math.round(litri).toLocaleString('it-IT') + ' Litri';
    document.getElementById('risultato').style.display = 'block';
  }

  function ottieniTemperaturaPosizione() {
    if (!navigator.geolocation) {
      alert("Geolocalizzazione non supportata.");
      return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await response.json();
        
        if (data.current_weather && data.current_weather.temperature !== undefined) {
          document.getElementById('temp').value = data.current_weather.temperature;
          calcolaLitri();
        } else {
          alert("Impossibile leggere la temperatura meteo locale.");
        }
      } catch (err) {
        alert("Errore di connessione durante la ricerca meteo.");
      }
    }, (error) => {
      alert("Permesso di localizzazione negato o GPS disattivato.");
    }, { enableHighAccuracy: true });
  }
</script>

</body>
</html>

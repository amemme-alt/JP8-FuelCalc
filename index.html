<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rifornimento JP-8</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JP-8 Fuel">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }
    h2 {
      margin: 0 0 16px 0;
      color: #1e3a8a;
      font-size: 1.4em;
      text-align: center;
    }
    .form-group { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 0.85em;
      color: #475569;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
      background-color: #f8fafc;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 0.95em;
      font-weight: bold;
      cursor: pointer;
    }
    .geo-btn {
      background-color: #059669;
      color: white;
      margin-bottom: 16px;
    }
    .result {
      margin-top: 20px;
      padding: 16px;
      background-color: #eff6ff;
      border-left: 4px solid #1e3a8a;
      border-radius: 8px;
    }
    .result p { margin: 4px 0; font-size: 0.9em; }
    .highlight {
      font-size: 1.4em;
      font-weight: 800;
      color: #1e3a8a;
      display: block;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>Calcolatore JP-8</h2>

  <button class="geo-btn" onclick="ottieniTemperaturaPosizione()">📍 Temperatura da Posizione</button>

  <div class="form-group">
    <label for="temp">Temperatura Ambiente (°C):</label>
    <input type="number" id="temp" step="0.1" value="15.0" oninput="calcolaLitri()">
  </div>

  <div class="form-group">
    <label for="attuale">Quantità Attuale a Bordo (kg):</label>
    <input type="number" id="attuale" placeholder="Es. 800" oninput="calcolaLitri()">
  </div>

  <div class="form-group">
    <label for="target">Quantità Finale Richiesta (kg):</label>
    <input type="number" id="target" placeholder="Es. 2000" oninput="calcolaLitri()">
  </div>

  <div class="result" id="risultato" style="display: none;">
    <p>Densità stimata JP-8: <strong id="densitaVal">--</strong> kg/L</p>
    <p>Massa da immettere: <strong id="massaVal">--</strong> kg</p>
    <p>Volume da rifornire:</p>
    <span class="highlight" id="litriVal">-- Litri</span>
  </div>
</div>

<script>
  function calcolaDensita(tempC) {
    return 0.800 - (0.0007 * (tempC - 15));
  }

  function calcolaLitri() {
    const temp = parseFloat(document.getElementById('temp').value);
    const attuale = parseFloat(document.getElementById('attuale').value);
    const target = parseFloat(document.getElementById('target').value);

    if (isNaN(temp) || isNaN(attuale) || isNaN(target) || target <= attuale) {
      document.getElementById('risultato').style.display = 'none';
      return;
    }

    const massaDaRifornire = target - attuale;
    const densita = calcolaDensita(temp);
    const litri = massaDaRifornire / densita;

    document.getElementById('densitaVal').innerText = densita.toFixed(4);
    document.getElementById('massaVal').innerText = massaDaRifornire.toFixed(0);
    document.getElementById('litriVal').innerText = Math.round(litri).toLocaleString('it-IT') + ' Litri';
    document.getElementById('risultato').style.display = 'block';
  }

  function ottieniTemperaturaPosizione() {
    if (!navigator.geolocation) {
      alert("Geolocalizzazione non supportata.");
      return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await response.json();
        
        if (data.current_weather && data.current_weather.temperature !== undefined) {
          document.getElementById('temp').value = data.current_weather.temperature;
          calcolaLitri();
        }
      } catch (err) {
        alert("Errore nel recupero della temperatura meteo.");
      }
    }, () => {
      alert("Impossibile accedere alla posizione GPS.");
    });
  }
</script>

</body>
</html>
